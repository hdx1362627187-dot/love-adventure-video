<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3ef">
  <meta name="description" content="一段为你珍藏的视频。">
  <title>爱，是一场伟大的冒险。</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238b4a51'/%3E%3Cpath d='M32 49S12 37 12 23a11 11 0 0 1 20-6 11 11 0 0 1 20 6c0 14-20 26-20 26Z' fill='%23fff8f3'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#3f3031; --muted:#877274; --rose:#8b4a51; --paper:#fffdfb; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; color: var(--ink); font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      background:
        radial-gradient(circle at 14% 9%, rgba(255,255,255,.95) 0 8%, transparent 30%),
        radial-gradient(circle at 89% 87%, rgba(212,170,168,.23), transparent 34%),
        linear-gradient(145deg, #fbf7f2, #f5ece9);
    }
    main { min-height: 100svh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); }
    article { width: min(100%, 720px); text-align: center; }
    .mark { width: 42px; height: 1px; margin: 0 auto 24px; background: var(--rose); opacity: .55; }
    h1 { margin: 0 0 30px; font-size: clamp(1.65rem, 6.5vw, 2.65rem); font-weight: 500; letter-spacing: .11em; line-height: 1.45; }
    .frame { padding: 8px; border-radius: 22px; background: rgba(255,255,255,.72); box-shadow: 0 24px 70px rgba(80,45,47,.14), 0 2px 10px rgba(80,45,47,.07); backdrop-filter: blur(8px); }
    video { display: block; width: 100%; max-height: 68svh; border-radius: 16px; background: #1e1919; }
    .note { margin: 20px 0 0; color: var(--muted); font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; font-size: .9rem; letter-spacing: .08em; }
    @media (max-width: 480px) {
      main { place-items: start center; padding-top: max(9svh, env(safe-area-inset-top)); }
      h1 { margin-bottom: 24px; }
      .frame { padding: 6px; border-radius: 18px; }
      video { border-radius: 13px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      article { animation: arrive .9s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(12px); } }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <div class="mark" aria-hidden="true"></div>
      <h1>爱，是一场伟大的冒险。</h1>
      <div class="frame">
        <video controls playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" preload="auto" aria-label="为你准备的视频">
          <source src="video-wechat.mp4?v=3" type="video/mp4">
          你的浏览器暂时无法播放这个视频。
        </video>
      </div>
      <p class="note">戴上耳机，慢慢看</p>
    </article>
  </main>
</body>
</html>
